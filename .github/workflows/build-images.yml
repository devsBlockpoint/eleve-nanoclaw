name: Construir y publicar imágenes

# Existe porque las imágenes se construían A MANO. Un push a main dejaba el
# código nuevo en GitHub pero la imagen en el registro seguía siendo la vieja, y
# el deploy bajaba fielmente esa versión anterior — sin ningún error visible.
# Pasó el 2026-07-31: mcp-monica corrió dos días con una imagen de 41 horas antes.

on:
  push:
    branches: [main]
    paths: ['mcp-monica/**', 'nanoclaw/**', '.github/workflows/build-images.yml']
  workflow_dispatch:        # también a mano, para reconstruir sin cambios

env:
  REGISTRY: ghcr.io
  OWNER: devsblockpoint

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false      # que una imagen rota no impida publicar la otra
      matrix:
        include:
          - nombre: mcp-monica
            contexto: mcp-monica
            dockerfile: mcp-monica/Dockerfile
          - nombre: nanoclaw-host
            contexto: nanoclaw
            dockerfile: nanoclaw/Dockerfile
          # 2.3 GB, con capas sueltas de 750 MB. Publicarla desde una máquina
          # local es poco fiable: Docker reintenta el blob ENTERO, así que una
          # capa que se corta al 90% vuelve a empezar de cero. Desde el runner
          # es GitHub → ghcr por la misma red, y deja de ser un problema.
          - nombre: nanoclaw-agent
            contexto: nanoclaw/container
            dockerfile: nanoclaw/container/Dockerfile

    steps:
      # nanoclaw-agent pesa 2.3 GB y el runner viene con poco margen: sin esto
      # el build muere con "no space left on device" a mitad.
      - name: Liberar espacio
        if: matrix.nombre == 'nanoclaw-agent'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El SHA del commit va como tag además de `latest`: sin él no hay forma de
      # saber qué código corre en producción, que fue justo el problema.
      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.nombre }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caché entre corridas, pero el COPY del código siempre se invalida
          # con el commit — no repite el problema de la capa vieja.
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}

      - name: Resumen
        run: |
          echo "### ${{ matrix.nombre }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
